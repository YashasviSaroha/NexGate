version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexgate-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexgate
      POSTGRES_PASSWORD: nexgate_dev_password
      POSTGRES_DB: nexgate
    volumes:
      - nexgate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexgate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexgate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexgate_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nexgate_pgdata:
  nexgate_redisdata:
